<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light" />
    <title>访问受限</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #eceae6;
        color: #1c1a18;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px 28px;
        text-align: center;
        border-radius: 16px;
        background: #f4f2ee;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.08);
      }
      h1 { margin: 0 0 10px; font-size: 22px; font-weight: 500; }
      p { margin: 0; color: #6a6460; font-size: 14px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>访问受限</h1>
      <p>当前网络地址不在允许访问范围内。</p>
    </main>
  </body>
</html>
